name: Live Compatibility Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - name: Run official-source live smoke
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SIGNALKIT_LIVE_RSS_URL: ${{ vars.SIGNALKIT_LIVE_RSS_URL }}
          SIGNALKIT_LIVE_JSON_FEED_URL: ${{ vars.SIGNALKIT_LIVE_JSON_FEED_URL }}
          SIGNALKIT_LIVE_REDDIT_SUBREDDIT: ${{ vars.SIGNALKIT_LIVE_REDDIT_SUBREDDIT }}
          REDDIT_ACCESS_TOKEN: ${{ secrets.REDDIT_ACCESS_TOKEN }}
          REDDIT_REFRESH_TOKEN: ${{ secrets.REDDIT_REFRESH_TOKEN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
        run: python scripts/live_smoke.py --json | tee live-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-smoke-report
          path: live-smoke.json
          if-no-files-found: ignore
